name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.7
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          echo "EXIT=$?" >> "$GITHUB_OUTPUT"

      - name: Collect build log
        if: always()
        run: |
          mkdir -p ci
          cp build.log ci/build.log 2>/dev/null || echo "no log" > ci/build.log
          { echo "=== run ${GITHUB_RUN_ID} ==="
            grep -n -A 40 "What went wrong" build.log | head -80
            echo "--- javac / kotlin errors ---"
            grep -nE "error:|\.java:[0-9]+:|^e: |error: cannot find symbol|Compilation failed" build.log | head -80
            echo "--- context around first error ---"
            awk '/error:/{found=NR} END{}' build.log >/dev/null
            FIRSTERR=$(grep -n -m1 "error:" build.log | cut -d: -f1)
            if [ -n "$FIRSTERR" ]; then sed -n "$((FIRSTERR>30?FIRSTERR-30:1)),$((FIRSTERR+60))p" build.log; fi
          } > ci/build-errors.txt 2>&1 || true
          wc -l ci/build.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: ci/build-errors.txt
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Push log to ci-logs branch
        if: always()
        env:
          T: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-logs
          git add -A ci
          git commit -m "ci logs run ${GITHUB_RUN_ID}" || echo "nothing to commit"
          git push -f "https://x-access-token:${T}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
