name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.7
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          echo "EXIT=$?" >> "$GITHUB_OUTPUT"

      - name: Collect build log
        if: always()
        run: |
          mkdir -p ci
          { echo "=== run ${GITHUB_RUN_ID} ==="
            echo "--- error lines ---"
            grep -E "^e: |^w: .*(error)|FAILURE:|What went wrong|Execution failed|Caused by|Could not|Unresolved reference|error:" build.log | head -120
            echo "--- tail 150 ---"
            tail -150 build.log
          } > ci/build-errors.txt 2>&1 || echo "no log" > ci/build-errors.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: ci/build-errors.txt
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Push log to ci-logs branch
        if: always()
        env:
          T: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-logs
          git add -A ci
          git commit -m "ci logs run ${GITHUB_RUN_ID}" || echo "nothing to commit"
          git push -f "https://x-access-token:${T}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
