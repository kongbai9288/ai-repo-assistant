name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.7
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Extract errors
        if: always()
        run: |
          grep -nE "^e: |error:|Unresolved reference|Type mismatch|None of the following|Expecting|Illegal|Argument type mismatch" build.log | head -60 > err.txt || true
          echo "--- head of err.txt ---"
          head -60 err.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: err
          path: err.txt
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Mark failure
        if: steps.build.outcome == 'failure'
        run: exit 1
